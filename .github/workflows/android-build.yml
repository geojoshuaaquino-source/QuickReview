name: Android Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: npm install

      - name: Typecheck
        run: npm run typecheck

      - name: Expo doctor
        run: npx expo-doctor

      - name: Generate Android project
        run: npx expo prebuild --platform android --non-interactive --no-install

      - name: Build release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Sign release APK with CI-only release key
        working-directory: android
        shell: bash
        run: |
          set -euo pipefail
          APK=$(find app/build/outputs/apk/release -maxdepth 1 -name '*.apk' -print -quit)
          test -n "$APK"
          KEYSTORE="$RUNNER_TEMP/quickreview-release.jks"
          KEY_PASSWORD=$(openssl rand -hex 24)
          keytool -genkeypair \
            -keystore "$KEYSTORE" \
            -storepass "$KEY_PASSWORD" \
            -keypass "$KEY_PASSWORD" \
            -alias quickreview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 1 \
            -dname "CN=QuickReview CI,O=QuickReview,C=PH" \
            -noprompt
          BUILD_TOOLS=$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -1)
          "$BUILD_TOOLS/zipalign" -f 4 "$APK" "$RUNNER_TEMP/quickreview-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" sign \
            --ks "$KEYSTORE" \
            --ks-pass "pass:$KEY_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --ks-key-alias quickreview \
            --out app/build/outputs/apk/release/quickreview-release.apk \
            "$RUNNER_TEMP/quickreview-release-aligned.apk"
          "$BUILD_TOOLS/apksigner" verify --verbose app/build/outputs/apk/release/quickreview-release.apk
          rm -f "$KEYSTORE" "$RUNNER_TEMP/quickreview-release-aligned.apk"

      - name: Upload installable APK
        uses: actions/upload-artifact@v4
        with:
          name: quickreview-android-release
          path: android/app/build/outputs/apk/release/quickreview-release.apk
          if-no-files-found: error
